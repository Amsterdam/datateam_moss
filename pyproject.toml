[build-system]
requires = [
  "setuptools>=61.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "datateam_moss"
version = "0.2.27"
description = "Functions needed for datateam MOSS (municipality of Amsterdam)"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "tabulate==0.9.0",
  "xxhash==3.4.1",
  "opentelemetry-sdk==1.39.0",
  "azure-monitor-opentelemetry-exporter==1.0.0b46",
  "azure-mgmt-monitor==7.0.0",
  "pandas==3.0.0",
  "pytz"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "databricks-sdk",
    "pytest>=7.4.4",
    "pyspark==3.5.2",
    "delta-spark>=3.2,<3.4",
]